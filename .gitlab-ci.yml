image: mohanlu/cv_detection:latest 

stages:
  - pre_commit
  - lint
  - format_code

before_script:
  - apt-get update -y
  - apt-get install fd-find build-essential python3-pip -y
  - ln -s $(which fdfind) /usr/local/bin/fd || true
  - pip3 install pre-commit black flake8 mypy
  - echo "ROS 2 environment sourced"
  - pre-commit install

pre_commit:
  stage: pre_commit
  script:
    - pre-commit clean
    - pre-commit run --all-files | tee pre-commit-log.txt

lint:
  stage: lint
  script:
    - cd /builds/nyu-robomaster/snb-331-vision-midterm/
    - flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    - mypy . --ignore-missing-imports

format_code:
  stage: format_code
  script:
    - black .
    - flake8 --ignore=E501 .
  only:
    - merge_requests
    - master
