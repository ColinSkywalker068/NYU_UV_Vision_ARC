stages:
  - test

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH"
    - if: "$CI_COMMIT_TAG"

default:
  interruptible: true

python_tracking_tests:
  stage: test
  image: python:3.11-slim
  script:
    - bash services/test-stm-env.sh
    - cd yolo_cpp/tools
    - >-
      python3 -m unittest
      test_robot_tracking_scenario.py
      test_robot_tracking_closed_loop_sim.py
      test_observation_launch_contract.py
    - cd ../..
    - >-
      python3 -m py_compile
      yolo_cpp/launch/basler.launch.py
      yolo_cpp/launch/realsense.launch.py
      yolo_cpp/launch/tracking_observe.launch.py
      Docker/bake_team_pylon_layer.py

ros_build_and_test:
  stage: test
  image: ros:humble-ros-base-jammy
  before_script:
    - apt-get update -qq
    - >-
      DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
      libopencv-dev
      ros-humble-tf2-geometry-msgs
      ros-humble-visualization-msgs
      ros-humble-ament-cmake-gtest
      ros-humble-ament-cmake-clang-format
      ros-humble-launch-ros
    - rm -rf /var/lib/apt/lists/*
  script:
    - . /opt/ros/humble/setup.sh
    - >-
      colcon build
      --packages-select cv_auto_aim_interfaces yolo_cpp
      --cmake-args -DBUILD_TESTING=ON
    - . install/setup.sh
    - colcon test --packages-select yolo_cpp --return-code-on-test-failure
    - colcon test-result --verbose
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit:
        - build/yolo_cpp/test_results/**/*.xml
    paths:
      - build/yolo_cpp/test_results/
      - log/
