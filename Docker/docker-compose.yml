version: "3"
services:
  my-container:
    image: nyuultraviolet/cv-dockerfile:xavier
    devices:
      - /dev/video0:/dev/video0
      - /dev/bus/usb:/dev/bus/usb
      - /tmp/argus_socket:/tmp/argus_socket
    network_mode: host
    ipc: host
    privileged: true
    environment:
      DISPLAY: :1
      QT_X11_NO_MITSHM: 1
      V4L2_DEVICES: V4L2_DEVICES
      NUMBA_THREADING_LAYER: omp
    volumes:
      - /etc/enctune.conf:/etc/enctune.conf
      - /etc/nv_tegra_release:/etc/nv_tegra_release
      - /home/ultraviolet:/home/ultraviolet
      - /dev:/dev
      - /tmp/.xX11-unix/:/tmp/.X11-unix
      - /root/.cache/:/root/.cache
    working_dir: /home/ultraviolet/CV_Detection/utils
    command: python3 ./uart_comms.py
