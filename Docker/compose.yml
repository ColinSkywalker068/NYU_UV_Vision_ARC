version: '3'
services:
   my-container:
      image: nyuultraviolet/cv-dockerfile:xavier
      devices:
         - /dev/video0:/dev/video0
         - /dev/bus/usb:/dev/bus/usb
         - /tmp/argus_socket:/tmp/argus_socket
      network_mode: host
      privileged: true
      environment:
         DISPLAY: :1
         QT_X11_NO_MITSHM: 1
         V4L2_DEVICES: V4L2_DEVICES
      volumes:
         - /etc/enctune.conf:/etc/enctune.conf
         - /etc/nv_tegra_release:/etc/nv_tegra_release
         - /tmp/nv_jetson_model:/tmp/nv_jetson_model
         - /home/ultraviolet:/home/ultraviolet
         - /dev:/dev
         - /tmp/.xX11-unix/:/tmp/.X11-unix
         - /root/.cache/:/root/.cache
      working_dir: /home/ultraviolet/Downloads/CV_Detection-sprint-s23-6/utils
      command: python3 ./main.py
